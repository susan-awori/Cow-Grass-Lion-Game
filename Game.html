<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cow Grass Lion</title>
  </head>
  <body>
    <p>Cow Grass Lion</p>
    <button
      onclick="
      const randomNumber = Math.random();

      let computerMove = '';

      if (randomNumber >= 0 && randomNumber < 1 / 3){
       computerMove = 'grass';
    } else if (randomNumber < 2/3){
       computerMove ='cow';
    } else if (randomNumber >= 2/3 && randomNumber < 1){
       computerMove = 'lion';
    }



    let result = '';
    if (computerMove === 'cow') {
      result = 'Tie.' ;
    } else if (computerMove === 'lion') {
      result = 'You lose.';
    } else if (computerMove === 'grass') {
      result = 'You win.';
    }

    alert(`You picked cow. I picked ${computerMove}. ${result}`);
      "
    >
      Cow
    </button>
    <button>Grass</button>
    <button>Lion</button>
  </body>
</html>
