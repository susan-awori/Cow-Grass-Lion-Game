<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cow Grass Lion</title>
  </head>

  <body>
    <p>Cow Grass Lion</p>
    <button id="btnCow">Cow</button>
    <button id="btnGrass">Grass</button>
    <button id="btnLion">Lion</button>

    <script>
      function randomMove() {
        const r = Math.random();
        if (r < 1 / 3) return "cow";
        if (r < 2 / 3) return "grass";
        return "lion";
      }

      function decideResult(player, computer) {
        if (player === computer) return "It's a tie.";
        // cow beats grass, grass beats lion, lion beats cow
        if (
          (player === "cow" && computer === "grass") ||
          (player === "grass" && computer === "lion") ||
          (player === "lion" && computer === "cow")
        ) {
          return "You win.";
        }
        return "You lose.";
      }

      function play(player) {
        const computer = randomMove();
        const result = decideResult(player, computer);
        alert(`You picked ${player}. I picked ${computer}. ${result}`);
      }

      document
        .getElementById("btnCow")
        .addEventListener("click", () => play("cow"));
      document
        .getElementById("btnGrass")
        .addEventListener("click", () => play("grass"));
      document
        .getElementById("btnLion")
        .addEventListener("click", () => play("lion"));
    </script>
  </body>
</html>
